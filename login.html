<!doctype html>
<html lang="vi">
  <head>
    <!-- Tai nguyen chung -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - WebGIS</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="login.css?v=6" />
  </head>

  <body>
    <!-- Bo cuc trang dang nhap -->
    <div class="auth-layout">
      <!-- Khu vuc nhan dien thuong hieu -->
      <aside class="brand-pane" aria-label="Brand">
        <div class="brand-center">
          <div class="brand-logo" title="Tài nguyên thiên nhiên">
            <img id="brandLogoImage" src="images/logo.jpg" alt="Logo" />
          </div>

          <div class="brand-title">
            <div>TÀI NGUYÊN</div>
            <div>THIÊN NHIÊN</div>
          </div>
        </div>
      </aside>

      <!-- Khu vuc form -->
      <main class="form-pane">
        <div class="form-wrap">
          <div id="authTitle" class="auth-title">ĐĂNG NHẬP HỆ THỐNG</div>

          <!-- Form dang nhap -->
          <section id="sectionLogin" class="form-section active">
            <form id="frmLogin" class="auth-form">
              <label class="field-label" for="loginUser"
                >Tài khoản / Email</label
              >

              <div class="input-pill">
                <input
                  id="loginUser"
                  type="email"
                  placeholder="Nhập email"
                  autocomplete="username"
                  required
                />
              </div>

              <label class="field-label" for="loginPass"
                >Mật khẩu / Password</label
              >

              <div class="input-pill">
                <input
                  id="loginPass"
                  type="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
              </div>

              <button id="btnLoginSubmit" type="submit" class="btn-primary">
                Đăng nhập
              </button>

              <div
                id="loginMsg"
                class="msg msg-error hidden"
                aria-live="polite"
              ></div>
            </form>

            <div class="links">
              <span>Bạn chưa có tài khoản?</span>
              <button
                id="btnShowRegister"
                type="button"
                class="link link-button"
              >
                Tạo tài khoản
              </button>
            </div>

            <div class="links">
              <span>
                Tài khoản sau khi đăng ký sẽ cần xác nhận email và chờ quản trị
                viên duyệt.
              </span>
            </div>

            <div class="links">
              <a href="index.html" class="link subtle">
                ← Quay lại bản đồ (Chế độ khách)
              </a>
            </div>
          </section>

          <!-- Form tao tai khoan -->
          <section id="sectionRegister" class="form-section">
            <form id="frmRegister" class="auth-form">
              <label class="field-label" for="registerName">Họ và tên</label>

              <div class="input-pill">
                <input
                  id="registerName"
                  type="text"
                  placeholder="Nhập họ và tên"
                  autocomplete="name"
                  required
                />
              </div>

              <label class="field-label" for="registerEmail">Email</label>

              <div class="input-pill">
                <input
                  id="registerEmail"
                  type="email"
                  placeholder="Nhập email"
                  autocomplete="email"
                  required
                />
              </div>

              <label class="field-label" for="registerPass">Mật khẩu</label>

              <div class="input-pill">
                <input
                  id="registerPass"
                  type="password"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  required
                />
              </div>

              <label class="field-label" for="registerPass2"
                >Nhập lại mật khẩu</label
              >

              <div class="input-pill">
                <input
                  id="registerPass2"
                  type="password"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  required
                />
              </div>

              <button id="btnRegisterSubmit" type="submit" class="btn-primary">
                Tạo tài khoản
              </button>

              <div
                id="registerMsg"
                class="msg msg-error hidden"
                aria-live="polite"
              ></div>
            </form>

            <div class="links">
              <span>Đã có tài khoản?</span>
              <button id="btnShowLogin" type="button" class="link link-button">
                Quay về đăng nhập
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="config.js"></script>
    <script src="common.js"></script>
    <script src="login.js?v=6"></script>
  </body>
</html>
